[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "panther-tuner-x"
version = "0.1.0"
description = "Cross-platform Phoenix 6 diagnostics and configuration workbench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6==6.10.2", "pyqtgraph==0.14.0", "numpy==2.2.6", "httpx==0.28.1", "phoenix6==26.3.0"]

[project.scripts]
panther-tuner = "panther_tuner.app:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-qt==4.5.0", "ruff==0.14.1", "pyinstaller==6.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/panther_tuner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: requires a separate CTRE simulation server"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
